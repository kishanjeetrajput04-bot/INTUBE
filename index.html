<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>INTUBE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,sans-serif;overflow:hidden;height:100vh}
#splash{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#E91E63,#9C27B0);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s}
#splash h1{font-size:48px;font-weight:900;letter-spacing:4px}
#splash p{margin-top:8px;opacity:.8;letter-spacing:2px;font-size:13px}
#splash .loader{margin-top:40px;width:40px;height:40px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#app{display:none;flex-direction:column;height:100vh}
#app.active{display:flex}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#000;border-bottom:1px solid #262626}
.logo{font-size:24px;font-weight:900;background:linear-gradient(45deg,#E91E63,#FF9800);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#main{flex:1;overflow-y:auto;padding-bottom:80px}
.screen{display:none}
.screen.active{display:block}
.stories{display:flex;gap:12px;padding:12px 16px;overflow-x:auto;border-bottom:1px solid #262626}
.story-item{flex-shrink:0;text-align:center;width:72px}
.story-ring{width:68px;height:68px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#E91E63,#FF9800,#9C27B0)}
.story-ring .inner{width:100%;height:100%;border-radius:50%;background:#000;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;overflow:hidden;border:2px solid #000}
.story-ring .inner img{width:100%;height:100%;object-fit:cover}
.story-item .name{font-size:11px;color:#888;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.post{background:#121212;margin-bottom:8px;border-bottom:1px solid #262626}
.post-header{display:flex;align-items:center;padding:12px;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#E91E63,#9C27B0);display:flex;align-items:center;justify-content:center;font-weight:bold;flex-shrink:0}
.post-header .info{flex:1}
.post-header .username{font-weight:600;font-size:14px}
.post-header .meta{font-size:11px;color:#888}
.post-media img,.post-media video{width:100%;max-height:600px;object-fit:cover;display:block}
.post-actions{display:flex;gap:16px;padding:12px}
.post-actions button{background:none;color:#fff;font-size:24px;border:none}
.post-actions button.liked{color:#E91E63}
.post-info{padding:0 12px 12px}
.post-info .likes{font-weight:600;font-size:14px;margin-bottom:4px}
.post-info .caption{font-size:14px;line-height:1.4}
.post-info .caption b{margin-right:6px}
.post-info .time{font-size:11px;color:#888;margin-top:6px}
#reels-container{height:calc(100vh - 60px - 80px);overflow-y:scroll;scroll-snap-type:y mandatory}
.reel{height:100%;scroll-snap-align:start;position:relative;background:#000;display:flex;align-items:center;justify-content:center}
.reel video{width:100%;height:100%;object-fit:contain}
.reel .overlay{position:absolute;bottom:0;left:0;right:0;padding:20px;background:linear-gradient(transparent,rgba(0,0,0,.8));display:flex;align-items:flex-end;gap:12px}
.reel .info{flex:1}
.reel .info .username{font-weight:600;margin-bottom:6px}
.reel .info .caption{font-size:13px;opacity:.9}
.reel .side-actions{display:flex;flex-direction:column;gap:20px;align-items:center}
.reel .side-actions button{background:none;color:#fff;font-size:26px;display:flex;flex-direction:column;align-items:center;gap:2px;border:none}
.reel .side-actions button span{font-size:11px}
.reel .seen-badge{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:20px;font-size:11px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#000;border-top:1px solid #262626;padding:8px 0;z-index:200}
.bottom-nav button{flex:1;background:none;color:#888;font-size:22px;padding:6px 0;display:flex;flex-direction:column;align-items:center;border:none}
.bottom-nav button.active{color:#E91E63}
.bottom-nav button span{font-size:10px;margin-top:2px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.active{display:flex}
.modal{background:#1e1e1e;border-radius:16px;padding:24px;width:100%;max-width:400px}
.modal h2{margin-bottom:16px;font-size:20px}
.modal input,.modal textarea{width:100%;padding:12px;margin-bottom:12px;background:#000;border:1px solid #262626;border-radius:8px;color:#fff;font-size:14px}
.modal textarea{resize:vertical;min-height:80px}
.btn-row{display:flex;gap:12px;margin-top:8px}
.btn{flex:1;padding:12px;border-radius:8px;background:#E91E63;color:#fff;font-weight:600;font-size:14px;border:none}
.btn.secondary{background:#333}
.file-pick{display:flex;gap:12px;margin-bottom:16px}
.file-pick label{flex:1;padding:16px;border:2px dashed #262626;border-radius:8px;text-align:center;font-size:13px}
.file-pick input{display:none}
.preview{width:100%;max-height:200px;object-fit:contain;border-radius:8px;margin-bottom:12px}
.chat-list-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #262626}
.chat-list-item .info{flex:1}
.chat-list-item .name{font-weight:600;font-size:14px}
.chat-window{position:fixed;inset:0;background:#000;z-index:500;display:flex;flex-direction:column}
.chat-header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #262626}
.chat-header .back{background:none;color:#fff;font-size:22px;border:none}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:75%;padding:8px 14px;border-radius:18px;font-size:14px;word-wrap:break-word}
.msg.me{align-self:flex-end;background:#E91E63}
.msg.other{align-self:flex-start;background:#333}
.msg .time{font-size:10px;opacity:.7;margin-top:4px;display:block;text-align:right}
.chat-input{display:flex;gap:8px;padding:12px 16px;border-top:1px solid #262626}
.chat-input input{flex:1;padding:12px 16px;background:#1e1e1e;border:none;border-radius:24px;color:#fff;font-size:14px;outline:none}
.chat-input button{background:#E91E63;color:#fff;padding:0 20px;border-radius:24px;font-weight:600;border:none}
.profile-header{padding:24px 16px;text-align:center}
.big-avatar{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#E91E63,#9C27B0);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:bold;margin:0 auto 12px}
.uname{font-size:20px;font-weight:600}
.email{color:#888;font-size:13px;margin-top:4px}
.profile-stats{display:flex;justify-content:space-around;padding:16px;border-top:1px solid #262626;border-bottom:1px solid #262626}
.stat{text-align:center}
.stat .num{font-size:20px;font-weight:700}
.stat .lbl{font-size:12px;color:#888;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px}
.grid .item{position:relative;aspect-ratio:1;overflow:hidden}
.grid .item img,.grid .item video{width:100%;height:100%;object-fit:cover}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.15);backdrop-filter:blur(10px);color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;z-index:5000;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
.empty{text-align:center;padding:60px 20px;color:#888}
.empty .icon{font-size:60px;margin-bottom:16px;opacity:.5}
</style>
</head>
<body>

<div id="splash">
  <h1>INTUBE</h1>
  <p>SHARE • CONNECT • EXPLORE</p>
  <div class="loader"></div>
</div>

<div id="app">
  <div class="topbar">
    <div class="logo">INTUBE</div>
    <div>
      <button onclick="manualRefresh()" style="background:none;color:#fff;font-size:20px;border:none;margin-right:12px">🔄</button>
      <button onclick="logout()" style="background:none;color:#fff;font-size:20px;border:none">⏻</button>
    </div>
  </div>
  <div id="main">
    <div class="screen active" id="screen-home">
      <div class="stories" id="stories-bar"></div>
      <div id="feed"></div>
    </div>
    <div class="screen" id="screen-reels"><div id="reels-container"></div></div>
    <div class="screen" id="screen-chat"><div id="chat-list"></div></div>
    <div class="screen" id="screen-profile"><div id="profile-content"></div></div>
  </div>
  <div class="bottom-nav">
    <button data-tab="home" class="active">🏠<span>Home</span></button>
    <button data-tab="reels">🎬<span>Reels</span></button>
    <button data-tab="upload">➕<span>Post</span></button>
    <button data-tab="chat">💬<span>Chat</span></button>
    <button data-tab="profile">👤<span>Profile</span></button>
  </div>
</div>

<div class="modal-bg" id="auth-modal">
  <div class="modal">
    <h2 id="auth-title">INTUBE mein aao</h2>
    <input id="auth-name" type="text" placeholder="Username">
    <input id="auth-email" type="email" placeholder="Email">
    <input id="auth-pass" type="password" placeholder="Password (min 4 chars)">
    <div class="btn-row">
      <button class="btn" id="auth-submit">Signup</button>
      <button class="btn secondary" id="auth-switch">Login</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="upload-type-modal">
  <div class="modal">
    <h2>Kya upload karna hai?</h2>
    <div class="btn-row" style="flex-direction:column;">
      <button class="btn" onclick="openUpload('post')">📸 Post (Feed mein)</button>
      <button class="btn" onclick="openUpload('reel')">🎬 Reel (Fullscreen)</button>
      <button class="btn secondary" onclick="closeModal('upload-type-modal')">Cancel</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="upload-modal">
  <div class="modal">
    <h2>Naya Post</h2>
    <div class="file-pick">
      <label>📷 Photo<input type="file" id="file-image" accept="image/*"></label>
      <label>🎥 Video<input type="file" id="file-video" accept="video/*"></label>
    </div>
    <div id="upload-preview"></div>
    <textarea id="upload-caption" placeholder="Caption likho..."></textarea>
    <div class="btn-row">
      <button class="btn secondary" onclick="closeModal('upload-modal')">Cancel</button>
      <button class="btn" id="upload-submit">Post karo</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="story-modal">
  <div class="modal">
    <h2>Story add karo</h2>
    <div class="file-pick">
      <label>📷 Photo<input type="file" id="story-file" accept="image/*"></label>
    </div>
    <div id="story-preview"></div>
    <div class="btn-row">
      <button class="btn secondary" onclick="closeModal('story-modal')">Cancel</button>
      <button class="btn" id="story-submit">Story daalo</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
var DB = {
  posts: JSON.parse(localStorage.getItem('intube_posts') || '[]'),
  reels: JSON.parse(localStorage.getItem('intube_reels') || '[]'),
  stories: JSON.parse(localStorage.getItem('intube_stories') || '[]'),
  users: JSON.parse(localStorage.getItem('intube_users') || '[]'),
  chats: JSON.parse(localStorage.getItem('intube_chats') || '{}'),
  currentUser: JSON.parse(localStorage.getItem('intube_current') || 'null')
};
function saveDB() {
  localStorage.setItem('intube_posts', JSON.stringify(DB.posts));
  localStorage.setItem('intube_reels', JSON.stringify(DB.reels));
  localStorage.setItem('intube_stories', JSON.stringify(DB.stories));
  localStorage.setItem('intube_users', JSON.stringify(DB.users));
  localStorage.setItem('intube_chats', JSON.stringify(DB.chats));
  localStorage.setItem('intube_current', JSON.stringify(DB.currentUser));
}
function q(s) { return document.querySelector(s); }
function qa(s) { return document.querySelectorAll(s); }
function showToast(m) {
  var t = q('#toast');
  t.textContent = m;
  t.classList.add('show');
  clearTimeout(window._tt);
  window._tt = setTimeout(function(){ t.classList.remove('show'); }, 2500);
}
function openModal(id) { q('#'+id).classList.add('active'); }
function closeModal(id) { q('#'+id).classList.remove('active'); }
function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function timeAgo(ts) {
  var s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return 'abhi';
  if (s < 3600) return Math.floor(s/60) + 'm';
  if (s < 86400) return Math.floor(s/3600) + 'h';
  return Math.floor(s/86400) + 'd';
}
function fileToDataURL(file) {
  return new Promise(function(resolve, reject) {
    var r = new FileReader();
    r.onload = function(){ resolve(r.result); };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function getNetworkId() {
  try {
    var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    return (navigator.onLine ? 'on' : 'off') + '-' + (c ? c.effectiveType : 'unknown');
  } catch(e) { return navigator.onLine ? 'online' : 'offline'; }
}
function checkNetwork() {
  var cur = getNetworkId(), last = localStorage.getItem('intube_net_id');
  if (last && last !== cur) {
    localStorage.setItem('intube_net_id', cur);
    localStorage.removeItem('intube_seen_reels');
    return true;
  }
  localStorage.setItem('intube_net_id', cur);
  return false;
}
function markReelSeen(id) {
  var s = JSON.parse(localStorage.getItem('intube_seen_reels') || '[]');
  if (s.indexOf(id) < 0) { s.push(id); localStorage.setItem('intube_seen_reels', JSON.stringify(s)); }
}
function getSeenReels() { return JSON.parse(localStorage.getItem('intube_seen_reels') || '[]'); }

window.addEventListener('online', function() {
  if (checkNetwork()) { showToast('🌐 Network change! Fresh feed'); renderFeed(); renderReels(); }
});

var authMode = 'signup';
q('#auth-switch').onclick = function() {
  authMode = authMode === 'login' ? 'signup' : 'login';
  q('#auth-title').textContent = authMode === 'login' ? 'Login karo' : 'Naya account';
  q('#auth-submit').textContent = authMode === 'login' ? 'Login' : 'Signup';
  q('#auth-switch').textContent = authMode === 'login' ? 'Signup' : 'Login';
};
q('#auth-submit').onclick = function() {
  var n = q('#auth-name').value.trim(), e = q('#auth-email').value.trim(), p = q('#auth-pass').value;
  if (!e || p.length < 4) return showToast('Email aur 4+ char password daalo');
  if (authMode === 'signup') {
    if (!n) return showToast('Username daalo');
    if (DB.users.find(function(u){return u.email===e;})) return showToast('Email already registered');
    var u = {id:'u_'+Date.now(), username:n, email:e, password:p, createdAt:Date.now()};
    DB.users.push(u); DB.currentUser = u; saveDB(); enterApp();
    showToast('Welcome ' + n + '! 🎉');
  } else {
    var f = DB.users.find(function(u){return u.email===e && u.password===p;});
    if (!f) return showToast('Galat email/password');
    DB.currentUser = f; saveDB(); enterApp();
    showToast('Welcome back! 👋');
  }
};
function logout() {
  if (!confirm('Logout?')) return;
  DB.currentUser = null; saveDB();
  q('#app').classList.remove('active');
  openModal('auth-modal');
}
function enterApp() {
  closeModal('auth-modal');
  q('#app').classList.add('active');
  loadAll();
}
qa('.bottom-nav button').forEach(function(b) {
  b.onclick = function() {
    var t = b.dataset.tab;
    if (t === 'upload') { openModal('upload-type-modal'); return; }
    qa('.bottom-nav button').forEach(function(x){ x.classList.remove('active'); });
    b.classList.add('active');
    qa('.screen').forEach(function(s){ s.classList.remove('active'); });
    q('#screen-' + t).classList.add('active');
    if (t === 'chat') renderChatList();
    if (t === 'profile') renderProfile();
    if (t === 'reels') renderReels();
    if (t === 'home') renderFeed();
  };
});
function manualRefresh() {
  var c = checkNetwork();
  showToast(c ? '🔄 Network change! Fresh feed' : '🔄 Refresh');
  renderFeed(); renderReels(); renderStories();
}
function loadAll() { renderStories(); renderFeed(); renderReels(); renderChatList(); renderProfile(); }

function renderStories() {
  var bar = q('#stories-bar'), u = DB.currentUser, now = Date.now();
  DB.stories = DB.stories.filter(function(s){ return now - s.timestamp < 86400000; });
  saveDB();
  var h = '<div class="story-item" onclick="openModal(\'story-modal\')"><div class="story-ring"><div class="inner">' + u.username[0].toUpperCase() + '</div></div><div class="name">Tumhari</div></div>';
  DB.stories.forEach(function(s, i) {
    h += '<div class="story-item" onclick="viewStory(' + i + ')"><div class="story-ring"><div class="inner">' +
      (s.url ? '<img src="' + s.url + '">' : s.username[0].toUpperCase()) +
      '</div></div><div class="name">' + esc(s.username) + '</div></div>';
  });
  bar.innerHTML = h;
}
q('#story-file').onchange = async function(e) {
  var f = e.target.files[0]; if (!f) return;
  var url = await fileToDataURL(f);
  q('#story-preview').innerHTML = '<img src="' + url + '" class="preview">';
};
q('#story-submit').onclick = async function() {
  var f = q('#story-file').files[0];
  if (!f) return showToast('File choose karo');
  var url = await fileToDataURL(f);
  DB.stories.push({id:'s_'+Date.now(), uid:DB.currentUser.id, username:DB.currentUser.username, url:url, timestamp:Date.now()});
  saveDB(); closeModal('story-modal');
  q('#story-preview').innerHTML = ''; q('#story-file').value = '';
  showToast('Story add ho gayi! ✨'); renderStories();
};
function viewStory(i) {
  var s = DB.stories[i]; if (!s) return;
  var v = document.createElement('div');
  v.className = 'chat-window';
  v.innerHTML = '<div style="padding:12px;display:flex;justify-content:space-between;color:#fff;font-weight:600"><span>' + esc(s.username) + '</span><button onclick="this.closest(\'.chat-window\').remove()" style="background:none;color:#fff;font-size:22px;border:none">✕</button></div><div style="flex:1;display:flex;align-items:center;justify-content:center"><img src="' + s.url + '" style="max-width:100%;max-height:100%;object-fit:contain"></div>';
  document.body.appendChild(v);
}

function renderFeed() {
  var feed = q('#feed');
  var posts = DB.posts.slice().sort(function(a,b){return b.timestamp-a.timestamp;});
  if (posts.length === 0) {
    feed.innerHTML = '<div class="empty"><div class="icon">📷</div>Abhi koi post nahi.<br>Pehla post tum karo!</div>';
    return;
  }
  feed.innerHTML = '';
  posts.forEach(function(post) {
    var d = document.createElement('div');
    d.className = 'post';
    var liked = post.likes && post.likes.indexOf(DB.currentUser.id) >= 0;
    d.innerHTML = '<div class="post-header"><div class="avatar">' + post.username[0].toUpperCase() + '</div><div class="info"><div class="username">' + esc(post.username) + '</div><div class="meta">' + timeAgo(post.timestamp) + '</div></div><button onclick="deletePost(\'' + post.id + '\')" style="background:none;color:#fff;font-size:20px;border:none">🗑️</button></div><div class="post-media">' + (post.type === 'video' ? '<video src="' + post.url + '" controls playsinline></video>' : '<img src="' + post.url + '">') + '</div><div class="post-actions"><button class="like-btn ' + (liked ? 'liked' : '') + '">' + (liked ? '❤️' : '🤍') + '</button><button>💬</button><button>📤</button><div style="flex:1"></div><button>🔖</button></div><div class="post-info"><div class="likes">' + (post.likes ? post.likes.length : 0) + ' likes</div><div class="caption"><b>' + esc(post.username) + '</b>' + esc(post.caption || '') + '</div><div class="time">' + timeAgo(post.timestamp) + '</div></div>';
    d.querySelector('.like-btn').onclick = function() {
      if (!post.likes) post.likes = [];
      var i = post.likes.indexOf(DB.currentUser.id);
      if (i >= 0) post.likes.splice(i, 1); else post.likes.push(DB.currentUser.id);
      saveDB(); renderFeed();
    };
    feed.appendChild(d);
  });
